<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1a55">
<title>Campeonato Mundial Villaraso 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
<style>
/* Plató de Cifras y Letras (TVE, años 80-90): azul de estudio con puntos de luz, fichas amarillas de cifras,
   fichas azules de letras y el reloj de 30 luces. Tele: escenario central + marcador abajo. Móvil: una columna. */
:root{
  --studio:#0a1a55;
  --studio-hi:#1a3cb0;
  --deep:#061038;
  --ink:#070b24;
  --line:#2f52c4;
  --tile:#1d44c7;
  --tile-hi:#4f78ef;
  --gold:#f6c21c;
  --gold-hi:#ffe27a;
  --gold-lo:#b98507;
  --cream:#f4f0e1;
  --muted:#a9b7ea;
  --red:#ef3b2c;
  --red-off:#2a1d5a;
  --green:#36cf7a;
  --glint:rgba(255,255,255,.07);
  --glint-2:rgba(255,255,255,.35);
  --shade:rgba(3,7,28,.72);
  --f-display:"Archivo Black","Arial Black",Impact,sans-serif;
  --f-cond:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{
  margin:0;background-color:var(--studio);
  background-image:radial-gradient(ellipse at 50% -10%,var(--studio-hi),transparent 62%),radial-gradient(var(--glint) 1.5px,transparent 1.7px);
  background-size:100% 100%,22px 22px;background-attachment:fixed;
  color:var(--cream);font-family:var(--f-body);font-size:16px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;
}
#app{max-width:1320px;margin:0 auto;padding-block:14px 28px;min-height:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:18px}
#app.phone{max-width:560px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
button,input{font:inherit}
.lbl{font-family:var(--f-cond);font-weight:700;text-transform:uppercase;letter-spacing:.16em;font-size:.82rem;color:var(--muted)}
.muted{color:var(--muted)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.stack{display:flex;flex-direction:column;gap:14px}

/* Logo */
.top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.logo{display:flex;flex-direction:column;line-height:1}
.logo .l1{font-family:var(--f-cond);font-weight:700;letter-spacing:.24em;text-transform:uppercase;font-size:.78rem;color:var(--muted)}
.logo .l2{font-family:var(--f-display);text-transform:uppercase;font-size:clamp(1.25rem,2.6vw,1.9rem);color:var(--gold);text-shadow:0 3px 0 var(--gold-lo);margin-top:3px}
.logo .l3{font-family:var(--f-cond);font-weight:800;letter-spacing:.2em;text-transform:uppercase;font-size:.72rem;color:var(--cream);margin-top:5px}
.topinfo{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pill{font-family:var(--f-cond);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:.85rem;padding:6px 12px;border-radius:999px;background:var(--deep);box-shadow:inset 0 0 0 1.5px var(--line);color:var(--cream);white-space:nowrap}
.pill.warn{box-shadow:inset 0 0 0 1.5px var(--red);color:var(--gold-hi)}
.pill.x2{background:var(--gold);color:var(--ink);box-shadow:none}

/* Fichas */
.tiles{display:flex;gap:clamp(4px,.8vw,8px);flex-wrap:wrap;justify-content:center}
.tl,.tn{--ts:56px;width:var(--ts);height:var(--ts);max-width:100%;display:grid;place-items:center;border-radius:7px;font-family:var(--f-display);font-size:calc(var(--ts)*.55);line-height:1;user-select:none}
.tl{background:linear-gradient(180deg,var(--tile-hi),var(--tile) 52%,var(--deep));color:var(--cream);box-shadow:inset 0 2px 0 var(--glint-2),0 4px 0 var(--ink)}
.tn{background:linear-gradient(180deg,var(--gold-hi),var(--gold) 50%,var(--gold-lo));color:var(--ink);box-shadow:inset 0 2px 0 var(--glint-2),0 4px 0 var(--ink)}
.tn.wide{width:auto;padding-inline:calc(var(--ts)*.22);font-size:calc(var(--ts)*.48)}
.tiles.xl .tl,.tiles.xl .tn{--ts:clamp(34px,7.4vw,96px)}
.tiles.lg .tl,.tiles.lg .tn{--ts:clamp(34px,6vw,74px)}
.tiles.md .tl,.tiles.md .tn{--ts:clamp(26px,8.2vw,52px)}
.tiles.tap .tl,.tiles.tap .tn{--ts:clamp(44px,16vw,64px)}
button.tl,button.tn{border:0;cursor:pointer}
button.tl:disabled,button.tn:disabled{opacity:.25;cursor:default}
.tn.sel,.tl.sel{outline:4px solid var(--cream);outline-offset:2px}

/* Paneles */
.board{background:linear-gradient(180deg,var(--deep),var(--ink));border:2px solid var(--line);border-radius:16px;padding:clamp(14px,2.4vw,26px);box-shadow:0 10px 30px var(--shade);min-width:0}
.hero{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding-block:10px 4px}
.hero .lbl{font-size:clamp(.8rem,1.6vw,1.1rem);letter-spacing:.32em;color:var(--cream)}
.title{font-family:var(--f-display);text-transform:uppercase;font-size:clamp(1.6rem,4vw,3rem);color:var(--gold);text-shadow:0 4px 0 var(--gold-lo);line-height:1.05}
.rname{font-family:var(--f-display);text-transform:uppercase;font-size:clamp(2.2rem,7vw,5.6rem);line-height:1;color:var(--gold);text-shadow:0 5px 0 var(--gold-lo)}
.rules{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;font-size:clamp(1rem,1.8vw,1.35rem);max-width:62ch}
.rules li{display:flex;gap:12px;align-items:baseline}
.rules li::before{content:"";flex:none;width:10px;height:10px;border-radius:2px;background:var(--gold);transform:translateY(-2px)}

/* Botones */
.btn{font-family:var(--f-cond);font-weight:800;text-transform:uppercase;letter-spacing:.07em;font-size:1.15rem;padding:13px 24px;border-radius:10px;border:0;background:var(--gold);color:var(--ink);box-shadow:0 4px 0 var(--gold-lo);cursor:pointer;line-height:1.1}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--gold-lo)}
.btn.ghost{background:transparent;color:var(--cream);box-shadow:inset 0 0 0 2px var(--line)}
.btn.red{background:var(--red);color:var(--cream);box-shadow:0 4px 0 var(--ink)}
.btn.big{font-size:1.4rem;padding:16px 30px}
.btn.full{width:100%}
.btn.sm{font-size:.95rem;padding:8px 14px}
.btn:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--gold-hi);outline-offset:3px}
a.btn{display:inline-block;text-decoration:none}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:4px}
input.txt{width:100%;box-sizing:border-box;padding:13px 14px;border-radius:10px;border:2px solid var(--line);background:var(--ink);color:var(--cream);font-size:1.1rem}

/* Trivial */
.q{font-family:var(--f-cond);font-weight:700;font-size:clamp(1.5rem,3.6vw,3rem);line-height:1.12;text-wrap:balance}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;padding:14px 16px;border-radius:12px;border:0;background:linear-gradient(180deg,var(--tile),var(--deep));box-shadow:inset 0 0 0 2px var(--line);color:var(--cream);font-family:var(--f-cond);font-weight:700;font-size:clamp(1.1rem,2.2vw,1.8rem);line-height:1.15;min-width:0;cursor:pointer}
.opt .ob{flex:none;width:1.8em;height:1.8em;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:var(--ink);font-family:var(--f-display);font-size:.8em}
.opt.sel{box-shadow:inset 0 0 0 4px var(--gold)}
.opt.ok{background:linear-gradient(180deg,var(--green),var(--deep) 140%);box-shadow:inset 0 0 0 3px var(--green)}
.opt.dim{opacity:.4}
.opt .who{display:block;font-family:var(--f-body);font-weight:500;font-size:.62em;color:var(--muted);margin-top:4px}
.opt span{min-width:0}

/* Reloj */
.clock{width:min(220px,100%);height:auto;display:block;margin-inline:auto}
.ck-bg{fill:var(--ink);stroke:var(--line);stroke-width:3}
.ck-seg{fill:var(--red-off)}
.ck-seg.on{fill:var(--red)}
.ck-num{fill:var(--cream);font-family:var(--f-display);font-size:58px}
.tbar{height:10px;border-radius:99px;background:var(--ink);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.tbar i{display:block;height:100%;background:var(--red);border-radius:99px;transition:width .25s linear}
.tline{display:flex;justify-content:space-between;align-items:center;gap:10px}
.secs{font-family:var(--f-display);color:var(--gold);font-size:1.3rem;font-variant-numeric:tabular-nums}

/* Juego en la tele */
.playgrid{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:18px;align-items:start}
.pside{display:flex;flex-direction:column;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;background:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line);font-weight:600;font-size:.95rem}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--red-off);box-shadow:inset 0 0 0 1.5px var(--muted)}
.chip.on .dot{background:var(--green);box-shadow:none}
.chip.done{background:var(--gold);color:var(--ink);box-shadow:none}
.chip button{background:none;border:0;color:inherit;cursor:pointer;padding:0 2px;font-weight:700}
.target{font-family:var(--f-display);font-size:clamp(3.4rem,10vw,8rem);line-height:1;letter-spacing:.06em;color:var(--gold);background:var(--ink);border-radius:14px;padding:.12em .35em;box-shadow:inset 0 0 0 3px var(--line),inset 0 0 40px var(--deep);text-shadow:0 0 18px var(--gold-lo);font-variant-numeric:tabular-nums;display:inline-block}
.center{display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px}
.emoji{font-size:clamp(4rem,14vw,10rem);line-height:1.1;letter-spacing:.08em}
.banner{font-family:var(--f-cond);font-weight:800;font-size:clamp(1.2rem,2.6vw,2rem);text-transform:uppercase;letter-spacing:.04em;color:var(--ink);background:var(--gold);padding:8px 18px;border-radius:10px}
.stages{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.stg{font-family:var(--f-cond);font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:10px 16px;border-radius:10px;background:var(--ink);box-shadow:inset 0 0 0 2px var(--line);color:var(--muted);text-align:center;line-height:1.1;border:0}
.stg b{display:block;font-family:var(--f-display);font-size:1.5rem;color:inherit}
.stg.on{background:var(--red);color:var(--cream);box-shadow:none}
button.stg{cursor:pointer}

/* Parejas y marcador */
.pairgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:16px}
.pairc{background:linear-gradient(180deg,var(--tile),var(--deep));border-radius:14px;padding:18px;box-shadow:inset 0 0 0 2px var(--line),0 6px 0 var(--ink);display:flex;flex-direction:column;gap:6px}
.pairc h3{font-family:var(--f-display);text-transform:uppercase;color:var(--gold);font-size:clamp(1.2rem,2.2vw,1.7rem);line-height:1.05}
.pairc .mem{font-family:var(--f-cond);font-weight:700;font-size:clamp(1.3rem,2.4vw,2rem);line-height:1.1}
.flip{animation:flip .7s cubic-bezier(.2,.9,.3,1.2) both;animation-delay:var(--d,0s)}
@keyframes flip{from{transform:perspective(600px) rotateY(90deg);opacity:0}to{transform:none;opacity:1}}
.marcador{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px;margin-top:auto}
.mc{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-radius:12px;background:var(--ink);box-shadow:inset 0 0 0 2px var(--line);min-width:0}
.mc .nm{font-family:var(--f-cond);font-weight:800;text-transform:uppercase;letter-spacing:.03em;font-size:1.05rem;line-height:1.05}
.mc .ms{font-size:.85rem;color:var(--muted);overflow-wrap:anywhere}
.mc .tn{--ts:46px;flex:none}
.mc.lead{box-shadow:inset 0 0 0 3px var(--gold)}
.mc>div{min-width:0}
.ptsrow{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.ptsc{display:flex;align-items:center;gap:10px;padding:8px 14px 8px 8px;border-radius:12px;background:var(--ink);box-shadow:inset 0 0 0 2px var(--line);font-family:var(--f-cond);font-weight:700;font-size:1.15rem}
.ptsc .tn{--ts:44px}

/* Tabla */
.standing{display:flex;flex-direction:column;gap:12px}
.srow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:14px;align-items:center}
.srow .pos{font-family:var(--f-display);font-size:1.6rem;color:var(--gold);text-align:center}
.srow .bar{height:14px;border-radius:99px;background:var(--ink);overflow:hidden;margin-top:6px;box-shadow:inset 0 0 0 1px var(--line)}
.srow .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-lo),var(--gold));border-radius:99px}
.srow .nm{font-family:var(--f-cond);font-weight:800;font-size:clamp(1.15rem,2.2vw,1.7rem);text-transform:uppercase;line-height:1.05}
.srow .gain{font-family:var(--f-cond);font-weight:700;color:var(--green);font-size:1rem}

/* Lienzos */
.cv{width:100%;max-width:100%;aspect-ratio:1;display:block;background:var(--ink);border-radius:14px;box-shadow:inset 0 0 0 2px var(--line);touch-action:none}
.drawgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),340px));justify-content:center;gap:14px}
.drawgrid figure{margin:0;display:flex;flex-direction:column;gap:8px}
.drawgrid figcaption{font-family:var(--f-cond);font-weight:700;font-size:1.1rem}

/* Listas */
.list{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 14px;border-radius:10px;background:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line);min-width:0}
.li .w{font-family:var(--f-display);letter-spacing:.06em;overflow-wrap:anywhere}
.li.bad{opacity:.5}
.li.bad .w{text-decoration:line-through}
.num{font-family:var(--f-display);color:var(--gold);font-variant-numeric:tabular-nums}

/* Hoja del menú */
.sheet{position:fixed;inset:0;z-index:20;background:var(--shade);display:flex;justify-content:flex-end}
.sheet-in{width:min(440px,100%);height:100%;overflow:auto;box-sizing:border-box;background:var(--deep);border-left:2px solid var(--line);padding:calc(18px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) 18px;display:flex;flex-direction:column;gap:18px}
.sheet h3{font-family:var(--f-cond);font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.adj{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:8px;align-items:center}

/* Móvil */
.phead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.phead .logo .l2{font-size:1.15rem}
.me{text-align:right;font-size:.9rem;line-height:1.2}
.me b{display:block;font-family:var(--f-cond);font-size:1.1rem;text-transform:uppercase}
.bigname{font-family:var(--f-display);text-transform:uppercase;color:var(--gold);font-size:clamp(2rem,10vw,3.4rem);line-height:1;text-shadow:0 4px 0 var(--gold-lo);overflow-wrap:anywhere}
.ops{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ops button{font-family:var(--f-display);font-size:1.7rem;padding:10px 0;border-radius:10px;border:0;background:var(--cream);color:var(--ink);cursor:pointer;box-shadow:0 4px 0 var(--muted)}
.ops button.sel{background:var(--red);color:var(--cream);box-shadow:0 4px 0 var(--ink)}
.steps{font-family:var(--f-cond);font-weight:700;font-size:1.15rem;display:flex;flex-direction:column;gap:4px}
.word{font-family:var(--f-display);font-size:clamp(1.6rem,9vw,2.6rem);letter-spacing:.12em;min-height:1.3em;text-align:center;color:var(--gold);overflow-wrap:anywhere}
.card{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.card button{aspect-ratio:1;border-radius:12px;border:0;background:var(--cream);color:var(--ink);font-family:var(--f-cond);font-weight:800;font-size:clamp(.85rem,3.6vw,1.05rem);line-height:1.05;padding:6px;cursor:pointer;overflow-wrap:anywhere;box-shadow:0 4px 0 var(--muted)}
.card button.on{background:var(--red);color:var(--cream);box-shadow:0 4px 0 var(--ink)}
.vote{display:flex;flex-direction:column;gap:8px}
.vote button{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-radius:12px;border:0;background:var(--tile);color:var(--cream);font-family:var(--f-cond);font-weight:800;font-size:1.25rem;text-transform:uppercase;cursor:pointer;box-shadow:inset 0 0 0 2px var(--line)}
.vote button .tn{--ts:36px}
.status{font-family:var(--f-cond);font-weight:700;font-size:1.1rem;text-align:center;color:var(--muted)}
.status.ok{color:var(--green)}
.gainbig{font-family:var(--f-display);font-size:clamp(3rem,16vw,5rem);color:var(--gold);line-height:1;text-shadow:0 5px 0 var(--gold-lo)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--cream);color:var(--ink);font-weight:700;padding:10px 18px;border-radius:10px;box-shadow:0 8px 24px var(--shade);max-width:calc(100% - 40px)}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:end}
.podium>div{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;min-width:0}
.podium .plat{width:100%;border-radius:12px 12px 0 0;background:linear-gradient(180deg,var(--tile-hi),var(--tile));display:grid;place-items:center;font-family:var(--f-display);font-size:2.4rem;color:var(--cream)}
.podium .p1 .plat{height:170px;background:linear-gradient(180deg,var(--gold-hi),var(--gold-lo));color:var(--ink)}
.podium .p2 .plat{height:120px}
.podium .p3 .plat{height:84px}
.podium .nm{font-family:var(--f-cond);font-weight:800;text-transform:uppercase;font-size:clamp(1rem,2.2vw,1.6rem);line-height:1.05}

@media (max-width:860px){
  .playgrid{grid-template-columns:minmax(0,1fr)}
  .opts{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){
  .flip{animation:none}
  .tbar i{transition:none}
}
</style>
<style>
/* Añadidos v2: QR de entrada, selector de nombre, música, tapas y carrera */
:root{--paper:#ffffff;--qr-ink:#070b24;--grass:#0f2a7a;--chk-a:#f4f0e1;--chk-b:#070b24}
.lobby{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px;align-items:start}
.qrcard{background:var(--paper);color:var(--qr-ink);border-radius:18px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:10px;box-shadow:0 0 0 6px var(--gold),0 14px 30px var(--shade);text-align:center}
.qrcard svg{width:min(320px,100%);height:auto;display:block}
.qrcard .lbl{color:var(--qr-ink)}
.qrcard .url{font-size:.78rem;overflow-wrap:anywhere;color:var(--qr-ink);max-width:100%}
.qrcard b{font-family:var(--f-display);text-transform:uppercase;font-size:1.3rem}
.namepick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.namepick button{padding:14px 10px;border-radius:12px;border:0;background:linear-gradient(180deg,var(--tile-hi),var(--tile));color:var(--cream);font-family:var(--f-cond);font-weight:800;font-size:1.15rem;text-transform:uppercase;line-height:1.1;cursor:pointer;box-shadow:0 4px 0 var(--ink);overflow-wrap:anywhere}
.namepick button.taken{opacity:.35}
.eq{display:flex;gap:6px;align-items:flex-end;height:70px;justify-content:center}
.eq i{width:12px;border-radius:3px;background:var(--gold);height:20%}
.eq.on i{animation:eq .9s ease-in-out infinite alternate}
.eq.on i:nth-child(2){animation-delay:-.3s}.eq.on i:nth-child(3){animation-delay:-.6s}.eq.on i:nth-child(4){animation-delay:-.15s}.eq.on i:nth-child(5){animation-delay:-.45s}.eq.on i:nth-child(6){animation-delay:-.75s}
@keyframes eq{from{height:15%}to{height:100%}}
.tapgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,180px),1fr));gap:14px}
.tapc{background:var(--ink);border-radius:14px;overflow:hidden;box-shadow:inset 0 0 0 2px var(--line);display:flex;flex-direction:column}
.tapc img,.tapc .noimg{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--deep)}
.tapc .noimg{display:grid;place-items:center;color:var(--muted);font-family:var(--f-cond)}
.tapc div{padding:10px 12px}
.tapc b{display:block;font-family:var(--f-cond);font-size:1.15rem;text-transform:uppercase;line-height:1.1}
.tapc span{color:var(--muted);font-size:.9rem}
.tprev{width:100%;max-width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:14px;background:var(--ink);box-shadow:inset 0 0 0 2px var(--line);display:block}
.vote button img{width:56px;height:56px;border-radius:10px;object-fit:cover;flex:none}
.vote button .vt{display:flex;gap:12px;align-items:center;text-align:left;min-width:0}
.vote button .vt small{display:block;font-family:var(--f-body);text-transform:none;font-weight:500;font-size:.85rem;color:var(--muted)}
.vote button.on{box-shadow:inset 0 0 0 3px var(--gold)}
.race{display:flex;flex-direction:column;gap:10px}
.lane{position:relative;height:84px;border-radius:12px;background:repeating-linear-gradient(90deg,var(--grass) 0 60px,var(--deep) 60px 120px);box-shadow:inset 0 0 0 2px var(--line);overflow:hidden}
.lane .finish{position:absolute;right:0;top:0;bottom:0;width:22px;background:repeating-conic-gradient(var(--chk-a) 0 25%,var(--chk-b) 0 50%) 0 0/11px 11px}
.runner{position:absolute;top:8px;left:calc(var(--x,0) * (100% - 300px) + 8px);display:flex;align-items:center;gap:10px;transition:left 1.6s cubic-bezier(.3,.9,.3,1.05);max-width:270px}
.runner img,.runner .noimg{width:66px;height:66px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 3px var(--gold);flex:none;background:var(--deep)}
.runner .noimg{display:grid;place-items:center;font-size:1.9rem}
.runner b{display:block;font-family:var(--f-cond);font-weight:800;font-size:1.15rem;text-transform:uppercase;line-height:1.05;text-shadow:0 2px 0 var(--ink);overflow-wrap:anywhere}
.runner small{display:block;color:var(--muted);font-size:.85rem}
.runner .rp{font-family:var(--f-display);color:var(--ink);background:var(--gold);border-radius:8px;padding:2px 8px;font-size:1.1rem}
.musicnote{font-size:.95rem;color:var(--muted)}
.mlist{display:flex;flex-direction:column;gap:6px;font-size:.9rem}
.mlist .bad{color:var(--red)}
.av{width:28px;height:28px;border-radius:50%;object-fit:cover;flex:none;box-shadow:0 0 0 2px var(--gold);background:var(--deep);vertical-align:middle}
.av.ini{display:inline-grid;place-items:center;background:linear-gradient(180deg,var(--tile-hi),var(--tile));color:var(--cream);font-family:var(--f-display);font-size:.8rem;line-height:1}
.av.lg{width:64px;height:64px;font-size:1.6rem}
.av.xl{width:110px;height:110px;font-size:2.6rem;box-shadow:0 0 0 4px var(--gold)}
.who{display:inline-flex;align-items:center;gap:7px;min-width:0}
.avs{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
.pairc .avs .who{font-family:var(--f-cond);font-weight:700;font-size:clamp(1.1rem,2vw,1.6rem)}
.mc .ms .av{width:22px;height:22px;font-size:.7rem;box-shadow:0 0 0 1.5px var(--gold)}
.mewrap{display:flex;align-items:center;gap:10px;min-width:0}
.mewrap .av{width:40px;height:40px;font-size:1rem}
label.btn{box-sizing:border-box;display:block;text-align:center;max-width:100%}
.avbig{width:180px;height:180px;border-radius:50%;overflow:hidden;margin:4px auto;display:grid;place-items:center;font-size:4.5rem;background:var(--deep);box-shadow:0 0 0 5px var(--gold),0 10px 24px var(--shade)}
.avbig img{width:100%;height:100%;object-fit:cover;display:block}
@media (max-width:860px){.lobby{grid-template-columns:minmax(0,1fr)}.runner{left:calc(var(--x,0) * (100% - 200px) + 8px);max-width:180px}}
@media (prefers-reduced-motion:reduce){.eq.on i{animation:none;height:60%}.runner{transition:none}}
</style>
</head>

<script src="mqtt.min.js"></script>
<script src="qrcode.js"></script>
<script src="content.js"></script>
<script src="app.js"></script>
